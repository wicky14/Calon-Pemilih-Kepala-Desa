{{define "content"}}
<div class="card narrow">
  <h2 class="h2">Ganti password</h2>
  {{if .User.MustChange}}
  <p class="muted small">Ini password awal dari admin. Demi keamanan, ganti dulu sebelum memakai aplikasi.</p>
  {{else}}
  <p class="muted small">Gunakan password yang tidak dipakai di tempat lain.</p>
  {{end}}

  {{if .ErrMsg}}<div class="alert err">{{.ErrMsg}}</div>{{end}}

  <form method="post" action="/password" class="form">
    {{template "csrf" .}}
    <label>Password saat ini
      <input type="password" name="current" required autocomplete="current-password">
    </label>
    <label>Password baru
      <input type="password" name="new" required minlength="8" autocomplete="new-password">
      <span class="hint">Minimal 8 karakter.</span>
    </label>
    <label>Ulangi password baru
      <input type="password" name="confirm" required minlength="8" autocomplete="new-password">
    </label>
    <button class="btn primary" type="submit">Simpan password</button>
  </form>
</div>
{{end}}
